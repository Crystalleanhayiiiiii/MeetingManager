spring.application.name=spring-cloud-gateway
spring.main.web-application-type=reactive

# Cấu hình cổng cho Spring Cloud Gateway
server.port=8083

# Cấu hình Eureka 
eureka.client.serviceUrl.defaultZone=http://192.168.2.15:8761//eureka/
# Cho phép dịch vụ đăng ký với Eureka
eureka.client.register-with-eureka=true 
# Lấy thông tin dịch vụ từ Eureka
eureka.client.fetch-registry=true
#eureka.instance.hostname=172.16.1.192  # Địa chỉ IP của máy 
eureka.instance.prefer-ip-address=true
# Thêm instance-id (tùy chọn, giúp nhận diện dịch vụ một cách rõ ràng)
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
# Kích hoạt tính năng service discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# Định tuyến yêu cầu tới RoomService
spring.cloud.gateway.server.webflux.routes[0].id=roomservice-route
# Load balancer với Eureka
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ROOMSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/rooms/**
# Cấu hình tài nguyên tĩnh (hình ảnh) từ ROOMSERVICE
spring.cloud.gateway.server.webflux.routes[1].id=image-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ROOMSERVICE  
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/images/** 
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1 
 # Cắt prefix "/images" trước khi chuyển tiếp tới ROOMSERVICE
# Định tuyến yêu cầu tới UserService
spring.cloud.gateway.server.webflux.routes[2].id=userservice-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USERSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users/**,/users/api/auth/**

spring.cloud.gateway.server.webflux.routes[3].id=meeting-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://MEETING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/meetings/**
# Path predicate trong .properties có thể truyền nhiều pattern bằng dấu phẩy

spring.cloud.gateway.server.webflux.routes[4].id=agendatask-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AGENDATASK
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/agendas/**,/tasks/**,/minutes/**

spring.cloud.gateway.server.webflux.routes[5].id=notifications-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**
