spring.application.name=meeting-service
spring.datasource.url=jdbc:mysql://localhost:3306/meetingservice
spring.datasource.username=root
spring.datasource.password=123qwe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.cloud.compatibility-verifier.enabled=false
# spring.kafka.producer.properties.request.timeout.ms=60000
# spring.kafka.producer.properties.delivery.timeout.ms=120000


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=meeting
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# tắt giao dịch khi debug (bạn đã làm)
# spring.kafka.producer.transaction-id-prefix=

# gửi/đợi hợp lý (tránh chờ 120s)
spring.kafka.producer.delivery-timeout-ms=30000
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.max.block.ms=15000
spring.kafka.producer.properties.spring.json.add.type.headers=false
# các tuỳ chọn tốc độ (không bắt buộc)
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.compression.type=snappy