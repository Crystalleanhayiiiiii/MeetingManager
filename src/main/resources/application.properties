# Kafka consumer configuration

spring.application.name=notificationservice
spring.datasource.url=jdbc:mysql://localhost:3306/notificationservice
spring.datasource.username=root
spring.datasource.password=123qwe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.cloud.compatibility-verifier.enabled=false
# spring.kafka.producer.properties.request.timeout.ms=60000
# spring.kafka.producer.properties.delivery.timeout.ms=120000


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.compatibility-verifier.enabled=false

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false




# Dùng ErrorHandlingDeserializer để bắt lỗi
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate cho JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Không cần type headers, chỉ định default type là Meeting
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.notificationservice.notificationservice.event.MeetingEvent