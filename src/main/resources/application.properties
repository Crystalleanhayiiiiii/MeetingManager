spring.application.name=RoomService
# Thông tin kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/RoomService?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Tự động cập nhật schema khi ứng dụng khởi động
spring.jpa.hibernate.ddl-auto=update    
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
server.port=8081

# Địa chỉ Eureka Server
eureka.client.serviceUrl.defaultZone=http://172.16.0.37:8761/eureka/
# Cho phép dịch vụ đăng ký với Eureka
eureka.client.register-with-eureka=true 
# Lấy thông tin dịch vụ từ Eureka
eureka.client.fetch-registry=true
eureka.instance.hostname=172.16.1.192  # Địa chỉ IP của máy 
eureka.instance.prefer-ip-address=true
# Thêm instance-id (tùy chọn, giúp nhận diện dịch vụ một cách rõ ràng)
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}