spring.application.name=userService
# Thông tin kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/userservice
spring.datasource.username=root
spring.datasource.password=123qwe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Tự động cập nhật schema khi ứng dụng khởi động
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
server.port=8082
# Địa chỉ Eureka Server
# eureka.client.serviceUrl.defaultZone=http://172.16.1.227:8761//eureka/
# Cho phép dịch vụ đăng ký với Eureka
eureka.client.register-with-eureka=false 
# Lấy thông tin dịch vụ từ Eureka
eureka.client.fetch-registry=false
#eureka.instance.hostname=172.16.1.192  # Địa chỉ IP của máy 
eureka.instance.prefer-ip-address=false
# Thêm instance-id (tùy chọn, giúp nhận diện dịch vụ một cách rõ ràng)
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
