server:
  port: 8089  # Cổng của ứng dụng
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://172.16.1.227:8761/eureka/
  instance:
    prefer-ip-address: true  # THÊM DÒNG NÀY
    instance-id: ${spring.cloud.client.ip-address}:${server.port}  # TÙY CHỌN
