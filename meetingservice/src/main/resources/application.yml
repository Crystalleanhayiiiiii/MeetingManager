server:
  port: 8087

spring:
  application:
    name: meetingservice

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://172.16.0.37:8761/eureka/
  instance:
    prefer-ip-address: true  # THÊM DÒNG NÀY
    instance-id: ${spring.cloud.client.ip-address}:${server.port}  # TÙY CHỌN